<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F4FA"/>
    </linearGradient>
    <linearGradient id="inkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#333946"/>
      <stop offset="100%" stop-color="#171B22"/>
    </linearGradient>
    <linearGradient id="cursorGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0967DC"/>
      <stop offset="100%" stop-color="#3799FF"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-8%" width="120%" height="124%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- macOS Porcelain Squircle -->
  <rect x="100" y="100" width="824" height="824" rx="188" fill="url(#cardBg)" stroke="#1A2433" stroke-opacity="0.075" stroke-width="4" filter="url(#cardShadow)"/>

  <!-- Subtle Ruled Paper Lines -->
  <g stroke="#263857" stroke-opacity="0.045" stroke-width="3" stroke-linecap="round">
    <line x1="176" y1="328" x2="848" y2="328"/>
    <line x1="176" y1="512" x2="848" y2="512"/>
    <line x1="176" y1="696" x2="848" y2="696"/>
  </g>

  <!-- Geometric Obsidian "M" -->
  <path d="M 277 661 L 277 363 L 425 588 L 573 363 L 573 661"
        fill="none"
        stroke="url(#inkGrad)"
        stroke-width="70"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Signature Cobalt Underscore Cursor "_" -->
  <rect x="646" y="628" width="140" height="68" rx="34" fill="url(#cursorGrad)"/>
</svg>
